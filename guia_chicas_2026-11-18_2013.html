<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cómo se trabaja · Guía para las chicas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101f;--bg2:#2b1650;--tx:#fff;--dim:rgba(255,255,255,.4);--pri:#ff5fa2;--card:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{height:100vh;height:100dvh;background:linear-gradient(180deg,var(--bg2),var(--bg) 75%);color:var(--tx);font:700 16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
header{padding:12px 18px 6px;text-align:center;flex:none}
header small{color:var(--pri);font-weight:800;letter-spacing:.04em;font-size:12px}
header h1{margin:2px 0 8px;font-size:17px}
.modes{display:inline-flex;background:var(--card);border-radius:99px;padding:4px}
.modes button{border:0;background:none;color:var(--tx);font:inherit;font-size:14px;padding:8px 18px;border-radius:99px;cursor:pointer;opacity:.65}
.modes button[aria-pressed=true]{background:var(--pri);opacity:1}
#lyrics{flex:1;min-height:0;position:relative;overflow-y:auto;padding:0 22px 45vh;scrollbar-width:none;mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#hero{height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#big{width:104px;height:104px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:44px;padding-left:8px;cursor:pointer;box-shadow:0 0 0 12px rgba(255,95,162,.18);animation:pulso 1.8s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 24px rgba(255,95,162,0)}}
#hero span{font-size:15px;color:var(--dim);font-weight:700}
#lyrics p{margin:0 0 18px;font-size:25px;line-height:1.25;font-weight:800;color:var(--dim);cursor:pointer;transition:color .3s,transform .3s;transform-origin:left}
#lyrics p.h{font-size:13px;color:var(--pri);letter-spacing:.06em;text-transform:uppercase;margin:34px 0 12px;opacity:.6}
#lyrics p.on{color:var(--tx);transform:scale(1.04)}
#lyrics p.h.on{opacity:1;transform:none}
#lyrics p.past:not(.h){color:rgba(255,255,255,.58)}
footer{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.bar{height:4px;background:var(--card);border-radius:9px;overflow:hidden;margin-bottom:10px}
#fill{height:100%;width:0;background:var(--pri);transition:width .3s}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px}
.ctl button{border:0;background:none;color:var(--tx);font-size:26px;cursor:pointer;padding:6px}
#play{width:56px;height:56px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:22px}
#info{text-align:center;font-size:12px;color:var(--dim);margin-top:6px;font-weight:500}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#lyrics p,#fill{transition:none}#big{animation:none}}
</style>
</head>
<body>
<header>
  <small>GUÍA PARA LAS CHICAS</small>
  <h1>Cómo se trabaja, de verdad</h1>
  <div class="modes" role="group" aria-label="Modo">
    <button id="mL" aria-pressed="true">🔊 Escuchar</button>
    <button id="mR" aria-pressed="false">📖 Solo leer</button>
  </div>
</header>
<main id="lyrics">
  <div id="hero"><button id="big" aria-label="Empezar">▶</button><span>Toca para empezar</span></div>
</main>
<footer>
  <div class="bar"><div id="fill"></div></div>
  <div class="ctl">
    <button id="prev" aria-label="Frase anterior">⏮</button>
    <button id="play" aria-label="Reproducir">▶</button>
    <button id="next" aria-label="Frase siguiente">⏭</button>
  </div>
  <div id="info">Toca una frase para ir a ella</div>
</footer>
<script>
const L=[
"#Antes de empezar",
"Vaya, chicas, les voy a explicar todo antes de decirles los nombres de las apps.",
"Y les explico por qué: no quiero que se descarguen nada a lo loco.",
"Porque después nadie les va a explicar cómo se retira el dinero, cómo se pasa a su cuenta, qué se hace y qué no se hace en la app, ni qué límites ponerle a los usuarios.",
"Todo eso lo vamos a ver aquí, con calma, y en orden.",
"#1. De qué se trata el trabajo",
"El trabajo es darle entretenimiento a hombres.",
"Y seamos claras: ningún hombre recarga una app para preguntarte qué color de camisa vas a usar hoy.",
"La mayoría busca cosas sexuales, y mejor que lo sepan desde ya.",
"Por eso esto se hace con la mente bien puesta: separen lo profesional de lo personal.",
"Ahí ustedes están en su papel, casi como una actriz.",
"Y quítense de la cabeza lo del “dinero fácil”, porque no lo es.",
"Requiere esfuerzo, dedicación y constancia. Pero con el tiempo, da resultados.",
"Las que de verdad ganan son las que entienden esto desde el inicio y se comprometen.",
"Y si todo esto les incomoda profundamente, o creen que no lo podrían manejar, este trabajo probablemente no es para ustedes. Es mejor saberlo antes de empezar.",
"#2. Cómo funciona la app",
"Piensen en el saldo del celular.",
"Ustedes recargan Claro, Tigo, Digicel, lo que sea, y si no tienen saldo, no llaman.",
"Pues aquí igual: los hombres recargan monedas en la app.",
"Si no tienen monedas, no pueden llamarnos ni entrar a nuestros lives.",
"Y esas monedas las gastan en cuatro cosas.",
"Uno: en llamadas. A ellos les descuentan monedas por cada minuto.",
"Dos: en regalos. Igual que en TikTok, nos pueden mandar regalos mientras platicamos o hacemos live.",
"Tres: en lives privados. Ustedes le ponen un precio a la entrada, y si no manda el regalo, no entra.",
"Cuatro: en las llamadas aleatorias, donde la app los conecta con una de nosotras.",
"La idea de la aleatoria es que el hombre las vea, le llame la atención, y la llamada pase a privada.",
"#3. Cómo les llega el dinero",
"Las monedas que a ellos les quitan, pasan automáticamente a ustedes.",
"Si un hombre se gastó 1,000 monedas en una llamada, esas 1,000 son suyas.",
"Por eso el objetivo es uno solo: alargar las llamadas. A ustedes les pagan por minuto.",
"Las monedas se van acumulando, y cuando llegan a la meta mínima, pueden retirar.",
"El retiro mínimo en Juno es de $10, y la app se los manda a Binance.",
"Pero no les recomiendo retirar apenas lleguen a $10, porque cobran comisión.",
"Con $10 les llegan solo $9.50. Cuando yo retiré $40, solo me quitaron $1.",
"O sea que conviene esperar y hacer un retiro más grande.",
"Y de Binance a su cuenta de banco, se los explico en un paso a paso aparte.",
"#4. Los hombres que se van a encontrar",
"Según mi experiencia, como el 90% ya viene con todo preparado.",
"Y casi siempre ese 90% no tiene dinero.",
"Pero no son inútiles: sirven para ganar bonos y cosas extras que da la app.",
"Luego están los que sí tienen dinero. Esos se notan, ya van a aprender a identificarlos.",
"Y están los conversadores. Hay bastantes.",
"Con ellos es con quienes más dinero me he hecho, porque son platicones y son los que más tienen.",
"Mi primera llamada larga fue con un hombre de Israel, hace 2 años.",
"Duró 40 minutos y yo estaba emocionadísima. Solo quería platicar, de qué le gustaba, de qué me gustaba a mí, de gatitos.",
"#5. Reglas y límites",
"En los lives públicos ustedes no se desnudan.",
"Lo público lo monitorea la app. Lo privado es donde el usuario paga por estar.",
"Nunca, nunca, nunca compren monedas.",
"En Juno sí aparece la opción de recargar, porque la app de usuarios y la de streamers es la misma. Pero no se toca.",
"Estas apps están hechas para que nosotras ganemos, no para que gastemos en ellos. Aquí no se invierte nada. Jamás.",
"Ustedes tienen el control: pueden bloquear o reportar a cualquiera que las incomode.",
"Nadie las obliga a hacer algo sexual si no quieren. Pero sí tienen que aprender a manejar esas situaciones con seguridad, actitud y carácter.",
"Si les sale alguien de El Salvador, se ve una banderita. Pueden bloquearlo o ignorarlo.",
"Y ojo: no es porque corran riesgo. Es por paz mental, a muchas no nos gusta atender a gente de nuestro mismo país.",
"Y aprendan a cobrar: estudien la plantilla de regalos, que yo se las voy a pasar.",
"#6. Las apps que NO deben usar",
"Hay unas apps de “mensajería” que son basura: Meyo, Sugo, Timo y Laila.",
"La meta mínima para retirar es de unos $10, y en algunas $5. Pero miren cómo se gana eso:",
"Te pagan 5 monedas por cada mensaje que te responde el usuario.",
"Ojo: no por los que tú mandas, sino por los que él te responde.",
"Y la meta mínima son como 15 o 16 mil monedas. Hagan la cuenta.",
"Nadie puede vivir 24 horas pegada ahí para sacar $10 a la semana.",
"Además, estas apps hasta te marcan la distancia que hay entre tú y el usuario.",
"Laila es peor: te conecta con gente lo más cerca que pueda. No la usen jamás en la vida.",
"#7. Por dónde sí empezar: Juno",
"Yo les recomiendo empezar en Juno.",
"Ahí salen clientes más normalitos, y la facturación no es altísima, pero tampoco ridículamente baja.",
"Ustedes entran a un live y se quedan ahí platicando con los que entren.",
"De repente les cae arriba una llamada aleatoria. No tienen que ir a buscarla, la app hace el trabajo.",
"Esto cansa muchísimo menos. La zona de llamadas aleatorias es la que más odiamos las streamers, porque ahí hay muchos hombres exhibiéndose y haciendo estupideces.",
"En Juno las monedas son baratas, y a los usuarios les cuesta mandar regalos.",
"Por eso Juno les enseña a negociar con el usuario de poquito, y a acostumbrarlo a pagar.",
"#8. Después de Juno: Salsa",
"Salsa paga más y es muy rentable. Cuando lleguen, les va a costar menos.",
"Pero es muy estricta. Ahorita están eliminando un montón de perfiles.",
"Allá yo hago mis lives premium a 800 monedas.",
"Para nosotras es poquito, pero a ellos 800 monedas les cuestan caras.",
"Una vez un usuario me pidió un live premium y aceptó las 800. El live duró menos de 5 minutos y me hice como dos fichas.",
"#9. Constancia, horas y reglas del juego",
"La constancia lo es todo.",
"Estas apps tienen un sistema que decide a quién le muestran más usuarios. Se llama algoritmo.",
"Si ustedes son constantes y generan monedas, el algoritmo trabaja a su favor y les salen más llamadas.",
"Si descuidan su actividad, el algoritmo cae, y reciben menos llamadas, menos oportunidades y menos dinero.",
"Por eso, al inicio, conéctense todos los días: la app las muestra más cuando detecta actividad constante.",
"Y por eso no funciona conectarse media hora, salirse y volver después.",
"Mi hermana trabajó en las apps y se conectaba tres días. Como le iba mal, decía: “ya no me conecto”.",
"Quería que le fuera bien por ley, justo a la hora que ella decía. Y así no funciona.",
"Cuando uno es nueva, toca hacer sacrificios, como probar horarios: madrugada, mañana, tarde, noche.",
"En Juno, a mí me funciona de 7 de la noche a 12, y de 6 de la mañana a 8 o 9. Pero busquen el suyo.",
"Para arrancar y aprender, les recomiendo empezar con 4 horas diarias seguidas, y aguantar un mes completo a ese ritmo.",
"Pero ojo: 4 horas es más bien un ingreso extra, y va a ser bajo.",
"Si quieren que esto sea su ingreso principal, hablamos de 8 a 12 horas diarias, de preferencia seguidas, o en máximo dos bloques.",
"Pregúntense cuántas horas le dedicarían a cualquier trabajo, y con qué responsabilidad irían. En un trabajo normal no faltan sin avisar, y aquí es igual.",
"Lo bueno: no gastan en transporte, no pierden tiempo en tráfico, trabajan desde casa y ustedes organizan su horario.",
"Pero necesitan un espacio privado donde nadie las interrumpa, y separar su tiempo personal del de trabajo. La disciplina no es opcional.",
"Si aguantan, estamos listas para dar el paso a Salsa.",
"#10. Referidos",
"Cuando lleguen a cierto nivel, les activan un link de referidos. A mí me lo activaron como a los $60.",
"Pueden invitar a otras chicas y ganar una comisión de lo que ellas ganen, creo que como el 5%.",
"Ojo: no se gana por invitar, se gana según lo que la otra chica trabaje. Esto no es una pirámide.",
"Si su amiga gana $50, ustedes ganan $2.50. Es poquito, pero es dinero.",
"También pueden invitar hombres, y les dan un porcentaje de lo que ellos gasten.",
"#11. Cómo nos vamos a comunicar",
"Todo lo vamos a centralizar en el grupo de WhatsApp.",
"En Facebook me han borrado comentarios y hasta me sacaron de un grupo. Así dejé chicas a medias.",
"En el grupo de noticias les voy mandando los audios. Reaccionen a cada uno, para yo saber si los van entendiendo.",
"Si algo no les queda claro, me dicen. Yo las ayudo.",
"Y ya después de leer todo esto, les paso la guía paso a paso para cobrar. 💜"
];
const $=s=>document.querySelector(s),box=$("#lyrics"),play=$("#play"),info=$("#info");
const SS="speechSynthesis" in window;
let i=0,on=false,listen=SS,tok=0,tm;
L.forEach((t,k)=>{const p=document.createElement("p"),h=t[0]==="#";p.textContent=h?t.slice(1):t;if(h)p.className="h";p.onclick=()=>{on=true;ui();go(k)};box.appendChild(p)});
const P=[...box.querySelectorAll("p")];
if(!SS){$("#mL").disabled=true;$("#mL").style.opacity=.3;$("#mL").setAttribute("aria-pressed","false");$("#mR").setAttribute("aria-pressed","true");info.textContent="Tu navegador no tiene voz: usa el modo Solo leer"}
function voz(){const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith("es"));return v.find(x=>/419|MX|US/i.test(x.lang))||v[0]}
function show(){P.forEach((p,k)=>{p.classList.toggle("on",k===i);p.classList.toggle("past",k<i)});const p=P[i];box.scrollTo({top:p.offsetTop-box.clientHeight*.38+p.offsetHeight/2,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});$("#fill").style.width=((i+1)/L.length*100)+"%"}
function ui(){play.textContent=on?"⏸":"▶";if(on)info.textContent=listen?"Escuchando…":"Leyendo…"}
function stop(){tok++;clearTimeout(tm);if(SS)speechSynthesis.cancel()}
function go(k){
  stop();if(k<0)k=0;
  if(k>=L.length){on=false;ui();info.textContent="Terminamos 💜";return}
  i=k;show();if(!on)return;
  const h=L[i][0]==="#",t=tok,txt=h?L[i].slice(1).replace(/^\d+\.\s*/,""):L[i];
  const sig=()=>{if(t===tok)tm=setTimeout(()=>{if(t===tok)go(i+1)},h?700:0)};
  if(listen){const u=new SpeechSynthesisUtterance(txt);u.lang="es-419";if(h)u.rate=.9;const v=voz();if(v)u.voice=v;u.onend=sig;u.onerror=sig;speechSynthesis.speak(u)}
  else tm=setTimeout(()=>{if(t===tok)go(i+1)},h?1300:900+txt.length*55);
}
function toggle(){on=!on;ui();if(!on)info.textContent="En pausa";go(i)}
play.onclick=toggle;$("#big").onclick=toggle;
$("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
function modo(l){if(l&&!SS)return;listen=l;$("#mL").setAttribute("aria-pressed",l);$("#mR").setAttribute("aria-pressed",!l);if(on){ui();go(i)}}
$("#mL").onclick=()=>modo(true);$("#mR").onclick=()=>modo(false);
</script>
</body>
</html>
